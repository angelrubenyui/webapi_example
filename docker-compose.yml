services:
  mi-sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: mi-sqlserver
    environment:
      SA_PASSWORD: YourStrongPassword123!
      ACCEPT_EULA: Y
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - app-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourStrongPassword123!" -C -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mi-api-exampleapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mi-api-exampleapi
    depends_on:
      mi-sqlserver:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=Server=mi-sqlserver,1433;Database=exampleDb;User Id=sa;Password=YourStrongPassword123!;Encrypt=false;TrustServerCertificate=true;
    ports:
      - "5000:5000"
    networks:
      - app-network

volumes:
  mssql_data:

networks:
  app-network:
    driver: bridge
